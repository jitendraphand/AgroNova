[workspace]
name = "rosenv"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]
[dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-localization = "*"
ros-jazzy-nav2-bringup = "*"
colcon-common-extensions = "*"
compilers = "*"
cmake = "*"
python = "3.12.*"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"
pytest = ">=9.2.0,<10"
pillow = ">=13.0.0,<14"
numpy = ">=2.5.4,<3"
