# Nav2 (Jazzy) baseline for AgroNova. Untuned; validate in simulation (Gate 4) before field use.
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odometry/local
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.8
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.36, 0.31], [0.36, -0.31], [-0.36, -0.31], [-0.36, 0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: scan, data_type: LaserScan, marking: true, clearing: true, max_obstacle_height: 2.0}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      footprint: "[[0.36, 0.31], [0.36, -0.31], [-0.36, -0.31], [-0.36, 0.31]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan: {topic: scan, data_type: LaserScan, marking: true, clearing: true}
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.25
velocity_smoother:
  ros__parameters:
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-1.0, 0.0, -1.5]
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    observation_sources: ["scan"]
    scan: {type: scan, topic: scan}
    polygons: ["StopZone"]
    StopZone: {type: polygon, points: "[[0.6, 0.4], [0.6, -0.4], [-0.1, -0.4], [-0.1, 0.4]]", action_type: stop, min_points: 4}
