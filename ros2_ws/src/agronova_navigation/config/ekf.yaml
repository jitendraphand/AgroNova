# robot_localization: local EKF (odom frame) fuses wheel odometry + IMU; global EKF (map) adds GNSS via navsat_transform.
ekf_local:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: wheel/odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    imu0: imu
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, true, false, false]
    imu0_remove_gravitational_acceleration: true
ekf_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map
    odom0: wheel/odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom1: odometry/gps
    odom1_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
    imu0: imu
    imu0_config: [false, false, false, false, false, true, false, false, false, false, false, true, true, false, false]
    imu0_remove_gravitational_acceleration: true
navsat_transform:
  ros__parameters:
    frequency: 10.0
    magnetic_declination_radians: 0.0  # TBD for deployment site
    yaw_offset: 0.0
    zero_altitude: true
    publish_filtered_gps: true
    use_odometry_yaw: true
    wait_for_datum: false
